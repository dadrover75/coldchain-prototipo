spring.application.name=backend-test

# Usar H2 en memoria para tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desactivar cliente Fabric durante tests
fabric.gateway.enabled=false

# Evitar conexión MQTT real en tests (puedes mockear, pero simplemente no usar BROKER_URI)
mqtt.broker.uri=tcp://localhost:1883

